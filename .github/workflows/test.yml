name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests without tree-sitter
        run: python3 core/tests/test_clean_check.py
      - name: Unit tests with tree-sitter
        run: |
          python3 -m pip install --quiet tree-sitter tree-sitter-language-pack
          python3 core/tests/test_clean_check.py
      - name: Aggregate output ceiling
        run: python3 core/tests/bench.py "$(python3 -c 'import sysconfig; print(sysconfig.get_paths()["stdlib"])')"
      - name: Self check
        run: python3 core/clean_check.py files core/clean_code/*.py core/tests/bench.py
